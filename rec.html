<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoplay Video with Sound</title>
    <style>
        body {
            text-align: center;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }
        video {
            max-width: 80%;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <h1>Welcome to My Homepage</h1>
    <p>Your video will autoplay with sound below.</p>

    <video autoplay loop controls playsinline>
        <source src="images/ghumi ghumi - sujan chapagain _ Cover By Subdho kc.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

</body>
</html>
