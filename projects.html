    color: #00ff00 !important;
    text-shadow: 0 0 6px #00ff00;
}

/* underline effect */
.navbar-nav .nav-link::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0%;
    height: 2px;
    background: #00ff00;
    transition: 0.3s;
}

/* underline expand on hover */
.navbar-nav .nav-link:hover::after {
    width: 100%;
}



/*Project name in hacker text*/

    text-shadow: 0 0 6px #00aa00, 0 0 12px #00ff00;

}
